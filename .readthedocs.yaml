version: 2

# Build environment
build:
   os: ubuntu-22.04
   tools:
      python: "3.11"
   apt_packages:
      - libgl1-mesa-glx
      - libglib2.0-0

# Sphinx configuration
sphinx:
   configuration: docs/conf.py

# Build formats: keep HTML and optional PDF if needed
formats:
   - html
   - pdf

# Python requirements for building docs
python:
   install:
      - requirements: docs/requirements.txt
